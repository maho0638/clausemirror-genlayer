# CI-only bridge: legacy CLI compose only sets DB_URL, while the
# current GenLayer database migration reads individual DB* variables.
# All services are ephemeral on a GitHub-hosted Docker runner.
services:
  database-migration:
    environment:
      DBUSER: ${DBUSER:-postgres}
      DBPASSWORD: ${DBPASSWORD:-postgres}
      DBHOST: postgres
      DBPORT: "5432"
      DBNAME: ${DBNAME:-genlayer_state}
  # The stable v0.121.25 release does not publish a matching hardhat tag.
  # Keep the optional dev-chain service on its existing published tag.
  hardhat:
    image: yeagerai/simulator-hardhat:latest
  # Upstream CLI replaces GenVM's entire web config with an incomplete
  # localhost-only fragment. Restore official required fields in a CI override.
  jsonrpc:
    environment:
      REDIS_URL: redis://redis:6379/0
    volumes:
      - ${GITHUB_WORKSPACE}/.github/genvm-web-local.yaml:/genvm/config/genvm-module-web.yaml:ro
  # Current Studio consensus processing uses a separate worker + Redis,
  # which are missing from the legacy genlayer-cli 0.39.1 Compose template.
  redis:
    image: redis:8-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
  consensus-worker:
    image: yeagerai/simulator-consensus-worker:latest
    environment:
      DBUSER: ${DBUSER:-postgres}
      DBPASSWORD: ${DBPASSWORD:-postgres}
      DBHOST: postgres
      DBNAME: ${DBNAME:-genlayer_state}
      WORKER_PORT: "4001"
      WORKER_POLL_INTERVAL: "5"
      WEBDRIVERHOST: webdriver
      WEBDRIVERPORT: "4444"
      REDIS_URL: redis://redis:6379/0
      LOG_LEVEL: info
    depends_on:
      database-migration:
        condition: service_completed_successfully
      webdriver:
        condition: service_healthy
      redis:
        condition: service_healthy
      jsonrpc:
        condition: service_healthy
    restart: unless-stopped

