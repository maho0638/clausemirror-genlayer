name: Contract verification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m compileall -q contracts tests
      - run: python -m pytest -q tests/test_clausemirror.py

  genvm-lint:
    runs-on: ubuntu-latest
    env:
      # Official release v0.6.0-rc10 contains the pinned SDK 0.3 runner.
      # Avoid GitHub release-discovery rate-limit fallback to obsolete rc3.
      GENVM_VERSION: v0.6.0-rc10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --pre 'genvm-linter==0.11.1rc2'
      - run: python scripts/compat_linter_sdk03.py
      - run: genvm-lint lint contracts/ClauseMirror.py
      - run: genvm-lint validate contracts/ClauseMirror.py

  real-sdk-direct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --pre pytest cloudpickle 'genlayer-test==0.30.0rc2'
      - run: python -m pytest -q tests/test_direct_sdk.py
