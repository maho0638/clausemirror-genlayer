name: ClauseMirror genuine local Studio GenVM check

on:
  pull_request:
    paths:
      - ".github/workflows/studio-localnet.yml"
      - "tests/test_studio_gate.py"
      - "gltest.config.yaml"
      - ".github/studio-ci-migration.yml"
      - ".github/genvm-web-local.yaml"
      - "contracts/ClauseMirror.py"
  workflow_dispatch:

concurrency:
  group: clausemirror-studio-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  isolated-studio-genvm:
    # Explicitly authorized isolated LOCALNET trial, not remote studionet.
    if: github.event_name == 'pull_request' && github.head_ref == 'audit/studio-gate-and-rpc-regression-20261104'
    runs-on: ubuntu-latest
    timeout-minutes: 28
    env:
      CI: "true"
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify temporary Docker runner
        run: |
          docker version
          docker info --format 'Docker server version {{.ServerVersion}}'
          df -h /
          free -m

      - name: Install official local GenLayer CLI and Python Studio harness
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libsecret-1-0
          npm install -g genlayer@0.39.1
          genlayer --version
          python -m pip install --pre pytest cloudpickle 'genlayer-test==0.30.0rc2'

      - name: Bridge outdated CLI database-migration environment (CI only)
        run: |
          CLI_DIR="$(npm root -g)/genlayer"
          # The CLI creates its own override before invoking Docker Compose.
          # Append a SECOND override supplying the DB* vars used by Alembic.
          # Legacy CLI .env defaults to 61999 (hosted Studionet), NOT localnet 61127.
          # Bind both Hardhat and RPC to localnet; never relax the chain-ID gate.
          cat >> "${CLI_DIR}/.env" <<'LOCAL_ENV'
GENLAYER_CHAIN_ID=61127
HARDHAT_CHAIN_ID=61127
LOCAL_ENV
          # The legacy CLI Compose does not pass chain IDs to all services.
          # Add a CI-generated final override, rather than changing production files.
          cat > "${RUNNER_TEMP}/clausemirror-local-chain.yml" <<'LOCAL_COMPOSE'
services:
  hardhat:
    environment:
      GENLAYER_CHAIN_ID: "61127"
      HARDHAT_CHAIN_ID: "61127"
  jsonrpc:
    environment:
      GENLAYER_CHAIN_ID: "61127"
      HARDHAT_CHAIN_ID: "61127"
  consensus-worker:
    environment:
      GENLAYER_CHAIN_ID: "61127"
      HARDHAT_CHAIN_ID: "61127"
LOCAL_COMPOSE
          echo "COMPOSE_FILE=${CLI_DIR}/docker-compose.yml:${CLI_DIR}/docker-compose.override.yml:${GITHUB_WORKSPACE}/.github/studio-ci-migration.yml:${RUNNER_TEMP}/clausemirror-local-chain.yml" >> "$GITHUB_ENV"
          echo "LOCALNETVERSION=v0.121.25" >> "$GITHUB_ENV"

      - name: Start disposable headless Studio without interactive init
        timeout-minutes: 14
        run: |
          # Official CLI init always prompts, including on fresh CI runners.
          # Post-install created the .env; this starts Docker without prompts.
          # CLI may exit on an early socket hangup while the actual JSON-RPC
          # container is still starting; the next step is the strict gate.
          timeout 780s genlayer up --headless --reset-validators --numValidators 5 || echo "::warning::CLI returned before JSON-RPC health; verifying localhost separately"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}'

      - name: Require healthy LOCALNET with correct chain ID
        timeout-minutes: 8
        run: |
          printf '%s\n' 'Waiting for a local RPC at 127.0.0.1:4000 (no remote fallback)'
          for n in $(seq 1 85); do
            if curl --silent --show-error --max-time 3 \
              -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","method":"eth_chainId","params":[],"id":1}' \
              http://127.0.0.1:4000/api > /tmp/genlayer-chain.json; then
              cat /tmp/genlayer-chain.json
              if python -c 'import json; d=json.load(open("/tmp/genlayer-chain.json")); assert d.get("result") in ("0xeec7", "0xEEC7")'; then
                echo "Confirmed local GenLayer chain 61127"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Genuine Studio localnet never became healthy"
          exit 1

      - name: Bring up consensus worker and prove five local validators
        timeout-minutes: 5
        run: |
          # Legacy Docker Compose can leave worker merely 'Created' while RPC
          # warms up; start it only after RPC passed strict 61127 chain check.
          docker compose -p genlayer up -d consensus-worker
          for n in $(seq 1 24); do
            if [ "$(docker inspect -f '{{.State.Running}}' genlayer-consensus-worker-1 2>/dev/null)" = "true" ]; then
              echo "Consensus worker container is running"
              break
            fi
            sleep 5
          done
          test "$(docker inspect -f '{{.State.Running}}' genlayer-consensus-worker-1)" = "true"
          # The legacy 'up' often aborts before reaching --reset-validators.
          # Query the real local RPC, create only missing isolated validators,
          # then assert exactly five. No live provider calls are made here.
          python - <<'PY'
          import json
          from urllib.request import Request, urlopen

          def rpc(method, params=None):
              body = json.dumps({"jsonrpc": "2.0", "id": 1, "method": method, "params": params or []}).encode()
              request = Request("http://127.0.0.1:4000/api", body, {"Content-Type": "application/json"})
              with urlopen(request, timeout=25) as response:
                  output = json.load(response)
              if "error" in output:
                  raise RuntimeError(f"{method}: {output['error']}")
              return output["result"]

          count = int(rpc("sim_countValidators"))
          print(f"Validators before local bootstrap: {count}")
          if count == 0:
              print("Creating 5 LOCAL validators for mocked Studio tests")
              rpc("sim_createRandomValidators", [5, 1, 10, [], []])
              count = int(rpc("sim_countValidators"))
          print(f"Validators after local bootstrap: {count}")
          assert count == 5, f"Expected exactly five local validators, got {count}"
          PY

      - name: Verify genuine GenVM five-validator local Studio transactions
        timeout-minutes: 7
        env:
          CLAUSEMIRROR_ENABLE_STUDIO_TESTS: "1"
        run: |
          timeout 390s gltest tests/test_studio_gate.py -v -s --network localnet --default-wait-interval 1500 --default-wait-retries 30

      - name: Capture local Studio diagnostic summary
        if: always()
        run: |
          echo "--- Running containers ---"
          docker ps --format 'table {{.Names}}\t{{.Status}}\t{{.Image}}' || true
          echo "--- Exited containers ---"
          docker ps -a --format 'table {{.Names}}\t{{.Status}}' || true
          echo "--- Failed database migration logs (latest 100 lines) ---"
          docker logs --tail 100 genlayer-database-migration-1 2>&1 || true
          echo "--- JSON-RPC logs (latest 140 lines) ---"
          docker logs --tail 140 genlayer-jsonrpc-1 2>&1 || true
          echo "--- Consensus worker logs (latest 120 lines) ---"
          docker logs --tail 120 genlayer-consensus-worker-1 2>&1 || true
          echo "--- RPC chain and validator count ---"
          curl --silent --show-error --max-time 5 -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' http://127.0.0.1:4000/api || true
          echo
          curl --silent --show-error --max-time 5 -H 'Content-Type: application/json' --data '{"jsonrpc":"2.0","id":2,"method":"sim_countValidators","params":[]}' http://127.0.0.1:4000/api || true
          echo
          echo "--- Postgres logs (latest 40 lines) ---"
          docker logs --tail 40 genlayer-postgres-1 2>&1 || true
          echo "--- Hardhat logs (latest 20 lines) ---"
          docker logs --tail 20 genlayer-hardhat-1 2>&1 || true
          echo "--- Toolchain ---"
          genlayer --version || true
          echo "No remote or public network transactions were authorized."
