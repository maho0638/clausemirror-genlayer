name: ClauseMirror contract verification gates
"on":
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install verification tools
        run: python -m pip install pytest genvm-linter genlayer-test
      - name: Python syntax validation
        run: python -m compileall -q contracts tests
      - name: Local deterministic contract tests (stubbed consensus)
        run: python -m pytest tests/test_contract.py -q
      - name: Official GenLayer SDK direct-mode tests
        run: python -m pytest tests/test_direct_sdk.py -q
      - name: Official GenVM lint and SDK checks
        run: genvm-lint check contracts/ClauseMirror.py